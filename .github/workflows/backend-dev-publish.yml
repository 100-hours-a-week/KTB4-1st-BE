name: Publish Backend-dev
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('[dev] Publish 수동배포 {0}', inputs.digest || 'latest') || '' }}

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      digest:
        description: "이미지 digest (sha256:...), 비우면 latest"
        required: false
        default: latest
        type: string

concurrency:
  group: backend-dev-publish
  # 배포 작업이 중단되어 발생할 수 있는 태그/패키지 상태 불일치 문제 방지(큐잉 처리)
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event_name == 'push'
    name: Build & Publish Dev Image (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=dev-,format=short
          labels: |
            org.opencontainers.image.title=Bakkucca-Backend-Dev
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # 이번 빌드의 digest를 개발 배포에 전달
      - name: Export image digest
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: dev 이미지 정리 (최신 3개만 유지)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: ktb4-1st-be
          delete-tags: "dev-*"
          keep-n-tagged: 3
          delete-untagged: true

  select-image:
    name: Select Dev Image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Validate dev image input
        env:
          REQUESTED_DIGEST: ${{ inputs.digest }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::개발 수동 배포는 dev 브랜치에서 실행해야 합니다"
            exit 1
          fi
          requested="${REQUESTED_DIGEST:-latest}"
          if [[ "$requested" != "latest" && ! "$requested" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest는 sha256:<64자리 소문자 16진수> 또는 latest여야 합니다"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dev image digest
        id: image
        shell: bash
        env:
          REQUESTED_DIGEST: ${{ inputs.digest }}
        run: |
          requested="${REQUESTED_DIGEST:-latest}"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$requested" == "latest" ]]; then
            image_ref="${repository}:latest"
          else
            image_ref="${repository}@${requested}"
          fi
          digest=$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::이미지 digest를 확인하지 못했습니다"
            exit 1
          fi
          echo "image=${repository}@${digest}" >> "$GITHUB_OUTPUT"

  # dev에 반영된 이미지를 해당 서비스의 개발 환경에 배포
  deploy-dev:
    name: Deploy Dev to ECS
    needs: [build-and-publish, select-image]
    if: ${{ always() && !cancelled() && (needs.build-and-publish.result == 'success' || needs.select-image.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: bakkucca-v2-dev-be
      ECS_SERVICE: bakkucca-v2-dev-be
      CONTAINER_NAME: backend
      CONTAINER_PORT: "8080"
      DEPLOY_STARTUP_MINUTES: "10"
      AWS_MAX_ATTEMPTS: "2"
      IMAGE_URI: ${{ needs.build-and-publish.outputs.image || needs.select-image.outputs.image }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Check deployment settings
        run: |
          : "${AWS_ROLE_ARN:?dev 환경의 AWS_ROLE_ARN Variable이 필요합니다}"

      - name: Configure AWS credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 이전 태스크 세트 정리만 확인하며 이미 진행 중인 다른 배포는 변경하지 않음
      - name: Wait for previous deployment cleanup
        id: previous
        run: |
          for attempt in {1..20}; do
            service=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0]' --output json)
            if jq -e '.desiredCount > 0 and (.taskSets | length) == 1 and
                .taskSets[0].status == "PRIMARY" and .taskSets[0].stabilityStatus == "STEADY_STATE" and
                .taskSets[0].runningCount == .desiredCount and .pendingCount == 0' <<< "$service" > /dev/null; then
              echo "task-definition=$(jq -r '.taskSets[0].taskDefinition' <<< "$service")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::이전 태스크 세트 정리를 확인하지 못했습니다"
          exit 1

      # 등록된 실행 설정을 유지하고 이미지 주소만 교체
      - name: Render task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.ECS_SERVICE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Create CodeDeploy AppSpec
        run: |
          jq -n --arg container "$CONTAINER_NAME" --argjson port "$CONTAINER_PORT" --arg provider "$ECS_SERVICE" '
            {version: 0.0, Resources: [{TargetService: {
              Type: "AWS::ECS::Service",
              Properties: {
                TaskDefinition: "",
                LoadBalancerInfo: {ContainerName: $container, ContainerPort: $port},
                CapacityProviderStrategy: [{CapacityProvider: $provider, Weight: 1}]
              }
            }}]}' > "$RUNNER_TEMP/appspec.json"

      - name: Deploy with CodeDeploy
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          codedeploy-appspec: ${{ runner.temp }}/appspec.json
          codedeploy-application: ${{ env.ECS_SERVICE }}
          codedeploy-deployment-group: ${{ env.ECS_SERVICE }}
          codedeploy-deployment-description: ${{ github.sha }} / ${{ github.run_id }}
          wait-for-service-stability: false

      - name: Monitor deployment and rollback on timeout
        id: monitor
        env:
          DEPLOYMENT_MODE: current
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.codedeploy-deployment-id }}
        run: python3 .github/scripts/wait-for-deployment.py

      - name: Stop AWS deployment when workflow is canceled
        id: cancel
        if: ${{ always() && cancelled() && steps.credentials.outcome == 'success' }}
        timeout-minutes: 2
        env:
          DEPLOYMENT_MODE: cancel
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.codedeploy-deployment-id }}
        run: python3 .github/scripts/wait-for-deployment.py

      - name: Record deployment
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
          PREVIOUS_TASK_DEFINITION_ARN: ${{ steps.previous.outputs.task-definition }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.codedeploy-deployment-id }}
        run: |
          {
            printf '### v2 dev 배포\n\n'
            printf '| 항목 | 값 |\n|---|---|\n'
            printf '| 결과 | %s |\n' "$DEPLOY_STATUS"
            printf '| 워크플로 커밋 | `%s` |\n' "$GITHUB_SHA"
            printf '| 이미지 | `%s` |\n' "$IMAGE_URI"
            printf '| 이전 태스크 정의 | `%s` |\n' "$PREVIOUS_TASK_DEFINITION_ARN"
            printf '| 새 태스크 정의 | `%s` |\n' "$TASK_DEFINITION_ARN"
            printf '| 배포 ID | `%s` |\n' "$DEPLOYMENT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deployment failure or stop
        if: ${{ always() && (failure() || cancelled() || steps.monitor.outputs.stopped-deployment-id != '') }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          STOP_STATUS: ${{ steps.cancel.outputs.stop-status || steps.monitor.outputs.stop-status }}
          DEPLOYMENT_ID: ${{ steps.cancel.outputs.stopped-deployment-id || steps.deploy.outputs.codedeploy-deployment-id }}
          STOP_REASON: ${{ steps.cancel.outputs.reason || steps.cancel.outputs.error || steps.monitor.outputs.reason || steps.monitor.outputs.error || '배포 실패 또는 실행 취소. 실행 로그에서 확인해야 함' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL이 없어 배포 알림을 생략합니다"
            exit 0
          fi
          deployment_url="https://${AWS_REGION}.console.aws.amazon.com/codesuite/codedeploy/deployments/${DEPLOYMENT_ID}?region=${AWS_REGION}"
          logs_url="https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#logsV2:log-groups/log-group/$(jq -rn --arg group "/ecs/$ECS_SERVICE" '$group | @uri')"
          jq -n --arg service "$ECS_SERVICE" --arg status "$DEPLOY_STATUS" \
            --arg reason "$STOP_REASON" --arg stop "$STOP_STATUS" --arg run "$RUN_URL" \
            --arg id "$DEPLOYMENT_ID" --arg deployment "$deployment_url" --arg logs "$logs_url" \
            '{content: ("[" + $service + "] 배포 결과: " + $status + "\n" + $reason +
              "\n" + $stop + "\nGitHub Actions: " + $run +
              (if $id == "" then "" else "\n배포 ID: " + $id + "\nCodeDeploy: " + $deployment end) +
              "\nCloudWatch Logs: " + $logs)}' > "$RUNNER_TEMP/deploy-notification.json"
          curl --silent --show-error --fail --connect-timeout 5 --max-time 15 \
            -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/deploy-notification.json" "$WEBHOOK_URL"
