name: Publish Backend-dev

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: backend-dev-publish
  # 배포 작업이 중단되어 발생할 수 있는 태그/패키지 상태 불일치 문제 방지(큐잉 처리)
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Dev Image (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=dev-,format=short
          labels: |
            org.opencontainers.image.title=Bakkucca-Backend-Dev
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Set Lowercase Package Name
        id: pkg
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # GHCR 패키지 명칭 규격(소문자)에 맞춰 패키지명 변환
          echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Prune old dev images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          min-versions-to-keep: 3
          ignore-versions: '^(?!dev-).*$'
        continue-on-error: true # 초기 배포 시 이미지가 3개 미만일 경우 워크플로우 실패 방지

      - name: Send Discord Notification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '수동 실행' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. 빌드 결과 상태값 분기
          case "$JOB_STATUS" in
            success)
              COLOR=3066993
              STATUS_EMOJI="✅"
              STATUS_TEXT="성공"
              ;;
            failure)
              COLOR=15158332
              STATUS_EMOJI="🚨"
              STATUS_TEXT="실패"
              ;;
            *)
              COLOR=15105570
              STATUS_EMOJI="⚠️"
              STATUS_TEXT="취소됨"
              ;;
          esac
          
          # 2. 커밋 메시지 줄바꿈 처리 (첫 줄만 요약 표시)
          FIRST_LINE_COMMIT_MSG=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # 3. jq를 통한 안전한 JSON 직렬화 (스크립트 인젝션 및 특수문자 깨짐 차단)
          jq -n \
            --arg title "${STATUS_EMOJI} [${WORKFLOW_NAME}] ${STATUS_TEXT}" \
            --argjson color "$COLOR" \
            --arg repo "\`${REPO_NAME}\`" \
            --arg ref "\`${REF_NAME}\`" \
            --arg actor "$ACTOR" \
            --arg commit "$FIRST_LINE_COMMIT_MSG" \
            --arg run_url "[GitHub Actions 실행 로그 바로가기](${RUN_URL})" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    { name: "저장소", value: $repo, inline: true },
                    { name: "브랜치 / 태그", value: $ref, inline: true },
                    { name: "트리거 유저", value: $actor, inline: true },
                    { name: "커밋 메시지", value: $commit },
                    { name: "상세 로그", value: $run_url }
                  ],
                  footer: { text: "바꾸까 배포 알림" },
                  timestamp: $time
                }
              ]
            }' > payload.json
          
          # 4. Webhook 전송
          curl -s -S --fail \
               -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "$WEBHOOK_URL"