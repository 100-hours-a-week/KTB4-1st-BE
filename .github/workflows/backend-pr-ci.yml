name: Backend PR Quality Gate

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # 파일 변경 감지: 문서만 수정된 PR이면 validate 잡을 실행하지 않고 패스
  changes:
    name: Check Target Changes
    runs-on: ubuntu-24.04-arm
    outputs:
      run_validation: ${{ steps.filter.outputs.run_validation }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run_validation:
              - '!**.md'
              - '!docs/**'
              - '!.gitignore'

  validate:
    name: Lint, Test & Docker Dry-run
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Static Code Analysis & Tests
        run: ./gradlew spotbugsMain pmdMain test --build-cache

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !env.ACT && (success() || failure()) }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          comment: true
          fail_on_failure: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Packaging (Dry-run)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=backend
          # pr 관련 이벤트에 항상 실행되는 워크플로우이기에, 캐시 hit 확률이 되려 낮아지고 리소스 낭비로 생각되어 cache-to 생략