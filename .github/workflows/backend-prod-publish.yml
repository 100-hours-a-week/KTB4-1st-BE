name: Publish Backend-prod

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: backend-prod-publish
  # 운영 태그 배포 작업이 도중에 취소되어 이미지가 누락되거나 태그가 꼬이지 않도록 직렬 큐잉 처리
  cancel-in-progress: false

jobs:
  publish-prod:
    name: Build & Publish Prod Image (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest 태그는 지양 정책에 따라 생성하지 않고, 푸시된 git tag만 추출
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Bakkucca-Backend-Prod
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # dev 빌드에서 적재된 GHA 원격 캐시를 재활용하여 배포 빌드 시간을 단축
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Set Lowercase Package Name
        id: pkg
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Prune old prod images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: 'container'
          # 운영 이미지는 롤백 여유를 위해 최근 5개 버전 유지
          min-versions-to-keep: 5
          ignore-versions: '^(?!v[0-9]+\.[0-9]+\.[0-9]+).*$'
        continue-on-error: true

      - name: Send Discord Notification
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '수동 실행' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. 웹훅 URL 미등록 시 에러 없이 스킵
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured. Skipping notification."
            exit 0
          fi
          
          # 2. 빌드 결과 상태값 분기
          case "$JOB_STATUS" in
            success)
              COLOR=3066993
              STATUS_EMOJI="✅"
              STATUS_TEXT="성공"
              ;;
            failure)
              COLOR=15158332
              STATUS_EMOJI="🚨"
              STATUS_TEXT="실패"
              ;;
            *)
              COLOR=15105570
              STATUS_EMOJI="⚠️"
              STATUS_TEXT="취소됨"
              ;;
          esac
          
          # 3. 커밋 메시지 줄바꿈 처리 및 타임스탬프 생성
          FIRST_LINE_COMMIT_MSG=$(printf '\%s\n' "$COMMIT_MSG" | head -n 1)
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # 4. jq를 통한 안전한 JSON 직렬화
          jq -n \
            --arg title "${STATUS_EMOJI} [${WORKFLOW_NAME}] ${STATUS_TEXT}" \
            --argjson color "$COLOR" \
            --arg repo "\`${REPO_NAME}\`" \
            --arg ref "\`${REF_NAME}\`" \
            --arg actor "$ACTOR" \
            --arg commit "$FIRST_LINE_COMMIT_MSG" \
            --arg run_url "[GitHub Actions 실행 로그 바로가기](${RUN_URL})" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    { name: "저장소", value: $repo, inline: true },
                    { name: "브랜치 / 태그", value: $ref, inline: true },
                    { name: "트리거 유저", value: $actor, inline: true },
                    { name: "커밋 메시지", value: $commit },
                    { name: "상세 로그", value: $run_url }
                  ],
                  footer: { text: "바꾸까 배포 알림" },
                  timestamp: $time
                }
              ]
            }' > payload.json
          
          # 5. Webhook 전송 (실패해도 워크플로우를 중단시키지 않음)
          curl -s -S --fail \
               -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "$WEBHOOK_URL" || echo "::warning::Failed to deliver Discord notification."