openapi: 3.0.3
info:
  title: Chatbot API
  description: |
    프론트엔드가 Spring 백엔드에 챗봇 질문을 보내는 API입니다.
    프론트엔드는 모달이 열려 있는 동안 대화 이력을 상태로 관리하고 요청에 함께 전달합니다.
    모달을 닫으면 대화 이력이 사라지며, Spring은 대화 이력을 저장하거나 이전 내역을 조회하지 않습니다.
  version: 1.0.0
servers:
  - url: /
    description: Spring 백엔드
paths:
  /chatbot/ask:
    post:
      tags:
        - Chatbot
      summary: 챗봇 질문
      description: |
        로그인한 사용자의 현재 질문과 프론트엔드가 전달한 이전 대화 내역을 AI 서버에 전달합니다.
        history는 최대 10개 메시지이며 생략하거나 null이면 빈 대화 내역으로 처리합니다.
        AI 서버의 응답은 data에 담아 반환합니다. Spring은 대화 이력을 저장하거나 불러오지 않습니다.
      operationId: askChatbot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotAskRequest'
            example:
              message: 그러면 그룹은요?
              history:
                - role: user
                  content: 그룹에서 거래하려면 어떻게 해야 하나요?
                - role: assistant
                  content: 먼저 그룹에 가입한 뒤 물품을 등록하고 교환을 요청할 수 있어요.
      responses:
        '200':
          description: 질문 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotAskSuccess'
              examples:
                withAction:
                  summary: 화면 이동 제안이 있는 답변
                  value:
                    data:
                      answer: 그룹 관련 정책에 관한 답변입니다.
                      action:
                        label: 그룹 관리 화면으로 이동
                        screen: GROUP_MANAGE
                    error: null
                withoutAction:
                  summary: 화면 이동 제안이 없는 답변
                  value:
                    data:
                      answer: 정확한 답변을 찾지 못했어요. 1:1 문의로 남겨주시면 확인해 드릴게요.
                      action: null
                    error: null
        '400':
          description: message가 비어 있거나 history의 메시지 형식이 잘못되었거나 10개를 초과함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                data: null
                error:
                  code: REQUEST_VALIDATION_FAILED
                  message: 요청 값이 올바르지 않습니다.
                  details:
                    - field: message
                      reason: 메시지는 필수 입력값입니다.
        '401':
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                data: null
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: 로그인이 필요합니다.
                  details: []
        '403':
          description: 접근 권한이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                data: null
                error:
                  code: FORBIDDEN
                  message: 접근 권한이 없습니다.
                  details: []
        '500':
          description: AI 서버 오류 또는 백엔드 설정 오류. AI 서버의 HTTP 422 응답도 이 API에서는 챗봇 오류로 변환됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                data: null
                error:
                  code: claude_timeout
                  message: 응답이 지연되고 있어요. 잠시 후 다시 시도해주세요.
                  details: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatbotAskRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: 현재 질문. 공백만 입력할 수 없습니다.
          example: 그러면 그룹은요?
        history:
          type: array
          nullable: true
          maxItems: 10
          description: 이전 대화 메시지. 생략하거나 null이면 빈 배열로 처리합니다.
          items:
            $ref: '#/components/schemas/ChatbotHistoryMessage'
    ChatbotHistoryMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: 공백만 입력할 수 없습니다.
    ChatbotAskSuccess:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/ChatbotAskResponse'
        error:
          type: object
          nullable: true
    ChatbotAskResponse:
      type: object
      required:
        - answer
        - action
      properties:
        answer:
          type: string
          description: 사용자에게 표시할 챗봇 답변
        action:
          type: object
          nullable: true
          description: 화면 이동 제안. 제안이 없거나 지원하지 않는 화면 값이면 null
          required:
            - label
            - screen
          properties:
            label:
              type: string
              description: 이동 버튼에 표시할 문구
            screen:
              type: string
              description: 프론트엔드에서 라우트로 매핑할 화면 식별자
              enum:
                - MY_PAGE
                - ITEM_LIST
                - ITEM_ADD
                - CHAT_LIST
                - GROUP_MANAGE
                - INTEREST_LIST
                - INQUIRY
    ApiErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: |
            원인 구분용 오류 코드. 500에서는 AI_CHATBOT_ENDPOINT_NOT_CONFIGURED,
            AI_CHATBOT_FAILED, claude_rate_limited, claude_timeout, claude_api_error,
            invalid_model_response, embedding_model_error, retrieval_error 중 하나.
        message:
          type: string
          description: 사용자에게 표시할 오류 안내
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorField'
    ApiErrorField:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
