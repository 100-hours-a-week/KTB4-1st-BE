openapi: 3.0.3
info:
  title: Message Refine API
  version: 1.0.0
  description: |
    로그인한 사용자의 채팅 메시지를 사용자별 취향 설정에 따라 다듬습니다.
    프론트엔드는 원문 message만 보내며, 스타일 설정은 백엔드가 저장된 사용자 취향에서 조회합니다.
servers:
  - url: /api
    description: 프론트엔드 API base path
tags:
  - name: Message Refine
    description: 채팅 메시지 다듬기
paths:
  /message-refine/refine:
    post:
      tags:
        - Message Refine
      summary: 채팅 메시지 다듬기
      operationId: refineMessage
      description: |
        로그인한 사용자의 저장된 취향 설정을 적용해 message를 다듬습니다.
        요청에는 message만 포함하며 styles나 answers는 보내지 않습니다.
        message는 현재 AI 서버 제한에 따라 최대 500자입니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRefineRequest'
            example:
              message: 안녕하세요, 내일 오후에 거래 장소에서 뵐 수 있을까요?
      responses:
        '200':
          description: 메시지 다듬기 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageRefineSuccess'
              example:
                data:
                  refined_message: 안녕하세요. 내일 오후에 거래 장소에서 뵐 수 있을까요?
                error: null
        '400':
          description: message가 없거나 공백뿐임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                data: null
                error:
                  code: REQUEST_VALIDATION_FAILED
                  message: 요청 값이 올바르지 않습니다.
                  details:
                    - field: message
                      reason: 메시지는 필수 입력값입니다.
        '401':
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                data: null
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: 로그인이 필요합니다.
                  details: []
        '404':
          description: 사용자 취향 설정을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                data: null
                error:
                  code: USER_PREFERENCE_NOT_FOUND
                  message: 사용자 취향이 설정되지 않았습니다.
                  details: []
        '502':
          description: AI 서버 호출 또는 응답 처리 실패. AI 서버가 허용하는 길이를 초과한 경우도 이 응답을 반환함.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                data: null
                error:
                  code: AI_MESSAGE_REFINE_FAILED
                  message: AI 메시지 다듬기에 실패했습니다.
                  details: []
        '500':
          description: 예기치 않은 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                data: null
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 오류가 발생했습니다.
                  details: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MessageRefineRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: 다듬을 원문 메시지. 공백만 입력할 수 없습니다.
          example: 안녕하세요, 내일 오후에 거래 장소에서 뵐 수 있을까요?
    MessageRefineSuccess:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/MessageRefineData'
        error:
          type: object
          nullable: true
    MessageRefineData:
      type: object
      required:
        - refined_message
      properties:
        refined_message:
          type: string
          description: AI가 다듬은 메시지
    ApiErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          enum:
            - REQUEST_VALIDATION_FAILED
            - AUTHENTICATION_REQUIRED
            - USER_PREFERENCE_NOT_FOUND
            - AI_MESSAGE_REFINE_FAILED
            - INTERNAL_SERVER_ERROR
        message:
          type: string
          description: 오류 안내 문구
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorField'
    ApiErrorField:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
