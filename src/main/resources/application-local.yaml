spring:
  datasource:
    url: jdbc:h2:mem:ktb-local;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

cors:
  allowed-origins: http://127.0.0.1:3000

auth:
  jwt:
    secret: local-only-jwt-secret-change-me-1234567890
  cookie:
    secure: false
  oauth:
    frontend-redirect-uri: http://127.0.0.1:3000/auth/callback
    kakao:
      redirect-uri: http://127.0.0.1:8080/auth/kakao/callback

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

sentry:
  dsn: ""
  send-default-pii: false
  logs:
    enabled: false
  traces-sample-rate: 0.0
  profile-session-sample-rate: 0.0
