spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        show_sql: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}

auth:
  jwt:
    secret: ${JWT_SECRET:}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://127.0.0.1:3000}
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:http://127.0.0.1:8080/auth/kakao/callback}
