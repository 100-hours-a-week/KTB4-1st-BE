spring:
  flyway:
    enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        show_sql: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-for-jwt}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://127.0.0.1:3000/auth/callback}
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:http://127.0.0.1:8080/auth/kakao/callback}
