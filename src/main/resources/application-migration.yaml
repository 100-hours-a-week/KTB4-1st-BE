spring:
  config:
    activate:
      on-profile: migration
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        show_sql: false

migration:
  enabled: true
  datasource:
    ec2:
      url: ${MIGRATION_EC2_DB_URL}
      username: ${MIGRATION_EC2_DB_USERNAME}
      password: ${MIGRATION_EC2_DB_PASSWORD}
    rds:
      url: ${MIGRATION_RDS_DB_URL}
      username: ${MIGRATION_RDS_DB_USERNAME}
      password: ${MIGRATION_RDS_DB_PASSWORD}
    maximum-pool-size: ${MIGRATION_DB_MAX_POOL_SIZE:20}
    minimum-idle: ${MIGRATION_DB_MIN_IDLE:2}
    connection-timeout-ms: ${MIGRATION_DB_CONNECTION_TIMEOUT_MS:5000}
  barrier:
    timeout-ms: ${MIGRATION_BARRIER_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "item.price.ai.request": true

monitoring:
  prometheus:
    auth:
      username: ${PROMETHEUS_AUTH_USERNAME}
      password: ${PROMETHEUS_AUTH_PASSWORD}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}

cors:
  allowed-origins: "https://bakkucca.com,${CORS_ALLOWED_ORIGINS}"

auth:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: true
  oauth:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
