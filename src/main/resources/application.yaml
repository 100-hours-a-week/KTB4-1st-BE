spring:
  application:
    name: KTB-Agile-backend

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      presigned-url-duration-seconds: ${AWS_S3_PRESIGNED_URL_DURATION_SECONDS:600}
      read-url-duration-seconds: ${AWS_S3_READ_URL_DURATION_SECONDS:3600}

ai:
  image-analysis-url: ${AI_IMAGE_ANALYSIS_URL:}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:90}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}

auth:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:300}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://127.0.0.1:3000}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://127.0.0.1:8080/auth/kakao/callback}
