spring:
  application:
    name: KTB-Agile-backend
  profiles:
    default: dev
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

sentry:
  dsn: https://229674fc538ca9111da07811ffe4537c@o4512173324500992.ingest.us.sentry.io/4512174894481408
  # Add request headers and IP data to events.
  send-default-pii: true
  # Enable sending logs to Sentry.
  logs:
    enabled: true
  # Captures all transactions; adjust this value in production.
  traces-sample-rate: 1.0
  # Profiles all profile sessions; adjust this value in production.
  profile-session-sample-rate: 1.0
  # Automatically start and stop profiling with each transaction.
  profile-lifecycle: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      presigned-url-duration-seconds: ${AWS_S3_PRESIGNED_URL_DURATION_SECONDS:600}
      read-url-duration-seconds: ${AWS_S3_READ_URL_DURATION_SECONDS:3600}

ai:
  image-analysis-url: ${AI_IMAGE_ANALYSIS_URL:}
  text-moderation-url: ${AI_TEXT_MODERATION_URL:}
  item-price-url: ${AI_ITEM_PRICE_URL:}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:90}

auth:
  jwt:
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
  oauth:
    state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:300}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
