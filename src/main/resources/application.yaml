spring:
  application:
    name: KTB-Agile-backend

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}

auth:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:300}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://127.0.0.1:3000}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://127.0.0.1:8080/auth/kakao/callback}
